apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: environments
  namespace: argocd

spec:
  generators:
    - git:
        repoURL: https://github.com/KaleeswarG25/cc-gitops.git
        revision: main
        directories:
          # Change this line to target the correct path pattern
          - path: argocd/environments/*
          - path: argocd/environments
            exclude: true


  template:

    metadata:
      name: '{{path.basename}}'

    spec:

      project: default

      source:
        repoURL: https://github.com/KaleeswarG25/cc-gitops.git
        targetRevision: main
        path: '{{path}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true