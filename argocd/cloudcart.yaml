apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudcart
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/KaleeswarG25/cc-gitops.git
    targetRevision: main
    path: helm/cloudcart

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudcart

  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true